<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5f8b">
<meta name="robots" content="noindex,nofollow">
<title>청풍 앱</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;
       align-items:center;justify-content:center;gap:18px;padding:28px 20px;
       font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
       background:#f4f5f7;color:#1c2430}
  h1{font-size:19px;margin:0 0 6px;letter-spacing:-.3px}
  p.sub{margin:0 0 14px;color:#6b7684;font-size:13px;text-align:center}
  a.app{display:flex;align-items:center;gap:14px;width:100%;max-width:380px;
        padding:17px 19px;border-radius:13px;text-decoration:none;color:#fff;
        box-shadow:0 2px 7px rgba(0,0,0,.14)}
  a.est{background:#1f5f8b} a.lot{background:#1e293b}
  a.app .ico{font-size:26px;line-height:1}
  a.app .nm{display:block;font-weight:700;font-size:16px}
  a.app .ds{display:block;font-size:12px;opacity:.85;margin-top:3px}
  .tip{max-width:380px;background:#fff;border:1px solid #dfe3e8;border-radius:11px;
       padding:13px 15px;font-size:13px;line-height:1.65;color:#1c2430}
  .tip b{color:#1f5f8b}
  footer{color:#9aa4b0;font-size:11px;margin-top:4px}
</style>
</head>
<body>
  <div style="text-align:center">
    <h1>청 풍</h1>
    <p class="sub">쓸 앱을 고르세요</p>
  </div>

  <a class="app est" href="estimate/">
    <span class="ico">📐</span>
    <span><span class="nm">현장견적</span><span class="ds">실측 → 견적서 · 도면</span></span>
  </a>

  <a class="app lot" href="lotto/">
    <span class="ico">🎱</span>
    <span><span class="nm">로또 번호</span><span class="ds">6/45 번호 도우미</span></span>
  </a>

  <div class="tip">
    <b>폰에 앱처럼 설치하기</b><br>
    위에서 앱을 연 뒤 크롬 메뉴(⋮) → <b>홈 화면에 추가</b>를 누르면
    바탕화면에 아이콘이 생기고, 그 다음부터는 <b>인터넷이 없어도</b> 열립니다.
  </div>

  <footer>청풍 · 내부용</footer>
</body>
</html>
